plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}

repositories {
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.

    maven {
        url "https://cursemaven.com"
    }

    maven {
        url "https://api.modrinth.com/maven"
    }

    maven {
        name = "FzzyMaven"
        url = "https://maven.fzzyhmstrs.me/"
    }

    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    implementation "me.fzzyhmstrs:fzzy_config:${fzzy_config_version}"

    compileOnly "curse.maven:jei-238222:8767595"
    runtimeOnly "curse.maven:jei-238222:8767595"

    compileOnly "curse.maven:roughly-enough-items-310111:8271755"
//    runtimeOnly "curse.maven:roughly-enough-items-310111:8271755"

    compileOnly "curse.maven:architectury-api-419699:8268577"
//    runtimeOnly "curse.maven:architectury-api-419699:8268577"

    runtimeOnly "curse.maven:cloth-config-348521:8269699"

    compileOnly "maven.modrinth:smooth-scroll:2.9.0"
//    runtimeOnly "maven.modrinth:smooth-scroll:2.9.0"

    runtimeOnly "maven.modrinth:carpet:26.2"
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}

sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}
