name: Minecraft Mod AI Issue Bot (DeepSeek)

on:
  issues:
    types: [opened]

jobs:
  ai-response:
    runs-on: ubuntu-latest

    permissions:
      issues: write
      contents: read

    steps:
      - name: AI Analyze Issue and Reply
        uses: actions/github-script@v7
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        with:
          script: |
            const issue = context.payload.issue;

            const title = (issue.title || "").slice(0, 300);
            const body = (issue.body || "").slice(0, 8000);

            const prompt =
              "You are a Minecraft Mod developer assistant.\n\n" +

              "LANGUAGE RULE:\n" +
              "- Detect user's language.\n" +
              "- Reply in same language only.\n\n" +

              "ISSUE ANALYSIS RULES:\n\n" +

              "If crash:\n" +
              "- Check crash report / latest.log\n" +
              "- If missing, request them\n\n" +

              "If logs exist:\n" +
              "- Identify likely causes:\n" +
              "  - missing dependency\n" +
              "  - mod version mismatch\n" +
              "  - mixin conflict\n" +
              "  - config error\n" +
              "  - class not found\n\n" +

              "Always include:\n" +
              "- This is only a suggestion and may not be accurate.\n\n" +

              "FINAL SENTENCE:\n" +
              "- If resolved: If resolved, you may close this issue.\n" +
              "- If not resolved: Please wait for maintainer response.\n\n" +

              "ISSUE:\n\n" +
              "Title:\n" + title + "\n\n" +
              "Body:\n" + body;

            let responseText = "";

            try {
              const response = await fetch(
                "https://api.deepseek.com/chat/completions",
                {
                  method: "POST",
                  headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${process.env.DEEPSEEK_API_KEY}`
                  },
                  body: JSON.stringify({
                    model: "deepseek-v4-flash",
                    messages: [
                      {
                        role: "system",
                        content: "You are a helpful Minecraft mod support assistant."
                      },
                      {
                        role: "user",
                        content: prompt
                      }
                    ],
                    temperature: 0.7,
                    max_tokens: 2000
                  })
                }
              );

              const data = await response.json();

              responseText =
                data?.choices?.[0]?.message?.content ||
                "Please provide more information about the issue.";
            } catch (err) {
              responseText =
                "AI request failed. Please check API key or network connection.";
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: responseText
            });
