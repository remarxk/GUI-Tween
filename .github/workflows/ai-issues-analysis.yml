name: Minecraft Mod AI Issue Bot (GLM + URL Parser)

on:
  issues:
    types: [opened]

jobs:
  ai-response:
    runs-on: ubuntu-latest

    permissions:
      issues: write
      contents: read

    steps:
      - name: AI Analyze Issue and Reply
        uses: actions/github-script@v7
        env:
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
        with:
          script: |
            const issue = context.payload.issue;

            const title = (issue.title || "").slice(0, 300);
            const body = (issue.body || "").slice(0, 20000);

            // ======================
            // 1. extract URLs
            // ======================
            const urls = body.match(/https?:\/\/\S+/g) || [];

            function convertUrl(url) {
              if (url.includes("mclo.gs/")) {
                const id = url.split("/").pop();
                return `https://api.mclo.gs/1/raw/${id}`;
              }
              return url;
            }

            async function fetchUrl(url) {
              try {
                const res = await fetch(url);
                if (!res.ok) return `[FETCH ERROR ${res.status}]`;
                return await res.text();
              } catch (e) {
                return `[FETCH FAILED ${e.message}]`;
              }
            }

            // ======================
            // 2. fetch logs safely
            // ======================
            let logsArray = [];

            for (const url of urls) {
              const fixed = convertUrl(url);
              const content = await fetchUrl(fixed);

              logsArray.push(
                [
                  "====================",
                  "SOURCE: " + url,
                  "FETCHED: " + fixed,
                  "====================",
                  content
                ].join("\n")
              );
            }

            const fetchedLogs = logsArray.join("\n\n");

            // ======================
            // 3. prompt (SAFE BUILD)
            // ======================
            const prompt = [
              "You are a Minecraft Mod crash analysis expert.",
              "",
              "RULES:",
              "- Only use provided logs",
              "- Do NOT hallucinate missing mods",
              "- If logs are incomplete, ask for full crash report",
              "",
              "TASK:",
              "- Find root cause",
              "- Identify mod conflicts",
              "- Provide fix steps",
              "",
              "IMPORTANT:",
              "- This is only a suggestion and may not be accurate.",
              "",
              "ISSUE TITLE:",
              title,
              "",
              "ISSUE BODY:",
              body,
              "",
              "CRASH LOGS:",
              fetchedLogs
            ].join("\n");

            // ======================
            // 4. call GLM
            // ======================
            let responseText = "";

            try {
              const response = await fetch(
                "https://open.bigmodel.cn/api/paas/v4/chat/completions",
                {
                  method: "POST",
                  headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${process.env.GLM_API_KEY}`
                  },
                  body: JSON.stringify({
                    model: "glm-5.1",
                    messages: [
                      {
                        role: "system",
                        content: "You are a senior Minecraft mod debugging engineer."
                      },
                      {
                        role: "user",
                        content: prompt
                      }
                    ],
                    temperature: 0.7,
                    max_tokens: 2000
                  })
                }
              );

              const data = await response.json();

              responseText =
                data?.choices?.[0]?.message?.content ||
                "No analysis result.";

            } catch (err) {
              responseText = "AI request failed: " + err.message;
            }

            // ======================
            // 5. reply
            // ======================
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: responseText
            });
