name: Minecraft Mod AI Issue Bot (Gemini 3.1 Flash Lite)

on:
  issues:
    types: [opened]

jobs:
  ai-response:
    runs-on: ubuntu-latest

    permissions:
      issues: write
      contents: read

    steps:
      - name: AI Analyze Issue and Reply
        uses: actions/github-script@v7
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          script: |
            const issue = context.payload.issue;

            const title = (issue.title || "").slice(0, 300);
            const body = (issue.body || "").slice(0, 8000);

            const prompt =
              "You are a Minecraft Mod developer assistant.\n\n" +

              "LANGUAGE RULE:\n" +
              "- Detect user's language.\n" +
              "- If Chinese → reply ONLY in Chinese.\n" +
              "- If English → reply ONLY in English.\n" +
              "- Otherwise → default to English.\n" +
              "- Do NOT mix languages.\n\n" +

              "ISSUE ANALYSIS RULES:\n\n" +

              "If crash:\n" +
              "- Check if crash report or latest.log is provided.\n" +
              "- If missing, ask for:\n" +
              "  - crash report\n" +
              "  - latest.log\n" +
              "  - Minecraft version\n" +
              "  - mod loader (Forge/Fabric/NeoForge)\n" +
              "  - mod list\n\n" +

              "If logs exist:\n" +
              "- Identify likely causes:\n" +
              "  - missing dependency\n" +
              "  - mod version mismatch\n" +
              "  - mixin conflict\n" +
              "  - config error\n" +
              "  - class not found\n\n" +

              "Always include:\n" +
              "- This is only a suggestion and may not be accurate.\n\n" +

              "FINAL SENTENCE:\n" +
              "- If resolved: If resolved, you may close this issue.\n" +
              "- If not resolved: Please wait for maintainer response.\n\n" +

              "ISSUE:\n\n" +
              "Title:\n" + title + "\n\n" +
              "Body:\n" + body;

            let responseText = "";

            try {
              const model = "models/gemini-3.1-flash-lite";

              const response = await fetch(
                `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${process.env.GEMINI_API_KEY}`,
                {
                  method: "POST",
                  headers: {
                    "Content-Type": "application/json"
                  },
                  body: JSON.stringify({
                    contents: [
                      {
                        role: "user",
                        parts: [
                          {
                            text: prompt
                          }
                        ]
                      }
                    ],
                    generationConfig: {
                      temperature: 0.7,
                      maxOutputTokens: 2000
                    }
                  })
                }
              );

              const data = await response.json();

              responseText =
                data?.candidates?.[0]?.content?.parts?.[0]?.text ||
                "Please provide more information about the issue.";
            } catch (err) {
              responseText =
                "AI request failed. Please check API key or network connection.";
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: responseText
            });
