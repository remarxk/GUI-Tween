name: Minecraft Mod AI Issue Bot (GLM 4.7 Flash)

on:
  issues:
    types: [opened]

jobs:
  ai-response:
    runs-on: ubuntu-latest

    permissions:
      issues: write
      contents: read

    steps:
      - name: AI Analyze Issue and Reply
        uses: actions/github-script@v7
        env:
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
        with:
          script: |
            const issue = context.payload.issue;

            const title = (issue.title || "").slice(0, 300);
            const body = (issue.body || "").slice(0, 8000);

            const prompt = `
You are a Minecraft Mod developer assistant.

LANGUAGE RULE:
- Detect user's language.
- If Chinese → reply ONLY in Chinese.
- If English → reply ONLY in English.
- Otherwise → default to English.
- Do NOT mix languages.

ISSUE ANALYSIS RULES:

If crash:
- Check if crash report or latest.log is provided.
- If missing:
  ask for:
  - crash report
  - latest.log
  - Minecraft version
  - mod loader (Forge/Fabric/NeoForge)
  - mod list

If logs exist:
- Identify likely causes:
  - missing dependency
  - mod version mismatch
  - mixin conflict
  - config error
  - class not found

Always include:
- "This is only a suggestion and may not be accurate."

FINAL SENTENCE:
- If resolved: "If resolved, you may close this issue."
- If not resolved: "Please wait for maintainer response."

ISSUE:

Title:
${title}

Body:
${body}
`;

            const response = await fetch("https://open.bigmodel.cn/api/paas/v4/chat/completions", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${process.env.GLM_API_KEY}`
              },
              body: JSON.stringify({
                model: "glm-4.7-flash",
                messages: [
                  {
                    role: "system",
                    content: "You are a helpful Minecraft mod support assistant."
                  },
                  {
                    role: "user",
                    content: prompt
                  }
                ],

                thinking: {
                  type: "enabled"
                },

                max_tokens: 2000,
                temperature: 0.7
              })
            });

            const data = await response.json();

            const reply =
              data.choices?.[0]?.message?.content ||
              "Please provide more information about the issue.";

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: reply
            });
