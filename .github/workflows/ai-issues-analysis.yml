name: Minecraft Mod AI Issue Bot (Safe Single Call)

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

jobs:
  ai-response:
    runs-on: ubuntu-latest

    permissions:
      issues: write
      contents: read

    steps:
      - name: AI Analyze Issue and Reply
        uses: actions/github-script@v7
        env:
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          script: |
            const issue = context.payload.issue;
            const comment = context.payload.comment;

            const isCommentEvent = !!comment;

            const title = (issue.title || "").slice(0, 300);
            const body = (issue.body || "").slice(0, 20000);

            const sender = comment?.user?.login;

            // =========================
            // 0. 防止 bot 自触发循环
            // =========================
            if (sender && sender.includes("github-actions")) {
              console.log("Skip bot comment to avoid loop");
              return;
            }

            const inputText = isCommentEvent
              ? (comment?.body || "")
              : (title + "\n" + body);

            // =========================
            // 1. 提取 URL + 日志
            // =========================
            const urls = body.match(/https?:\/\/[^\s<>"')]+/g) || [];

            function convertUrl(url) {
              if (url.includes("mclo.gs/")) {
                const clean = url.replace(/\/+$/, "");
                const id = clean.split("/").pop().split("?")[0];
                return `https://api.mclo.gs/1/raw/${id}`;
              }
              return url;
            }

            async function fetchUrl(url) {
              try {
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 8000);

                const res = await fetch(url, { signal: controller.signal });
                clearTimeout(timeout);

                if (!res.ok) return "";

                const text = await res.text();
                return text.slice(0, 20000);
              } catch (e) {
                return "";
              }
            }

            let logsArray = [];

            for (const url of urls) {
              const fixed = convertUrl(url);
              const content = await fetchUrl(fixed);

              if (!content) continue;

              logsArray.push([
                "====================",
                "SOURCE: " + url,
                "FETCHED: " + fixed,
                "====================",
                content
              ].join("\n"));
            }

            const fetchedLogs = logsArray.join("\n\n");

            // =========================
            // 2. 单次 AI Prompt（SKIP / REPORT）
            // =========================
            const prompt = [
              "You are a Minecraft mod issue triage system.",
              "",
              "You must decide if this is a real crash/bug.",
              "",
              "OUTPUT RULES:",
              "- If NOT a bug (question/suggestion/discussion): output exactly SKIP",
              "- If BUG/crash: output REPORT then analysis",
              "",
              "REPORT FORMAT:",
              "## Possible Cause",
              "## Suspected Mods",
              "## Suggested Fixes",
              "## Confidence",
              "",
              "RULES:",
              "- MUST start with SKIP or REPORT",
              "- No extra text before keyword",
              "- Only use provided logs",
              "",
              "TITLE:",
              title,
              "",
              "BODY:",
              body,
              "",
              "LOGS:",
              fetchedLogs || "NO LOGS PROVIDED"
            ].join("\n");

            // =========================
            // 3. CALL GLM (ONLY ONCE)
            // =========================
            let output = "";

            try {
              const response = await fetch(
                "https://open.bigmodel.cn/api/paas/v4/chat/completions",
                {
                  method: "POST",
                  headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${process.env.GLM_API_KEY}`
                  },
                  body: JSON.stringify({
                    model: "glm-5.1",
                    temperature: 0.4,
                    max_tokens: 2000,
                    messages: [
                      {
                        role: "system",
                        content: "You are a strict Minecraft issue triage engine."
                      },
                      {
                        role: "user",
                        content: prompt
                      }
                    ]
                  })
                }
              );

              const data = await response.json();
              output = data?.choices?.[0]?.message?.content?.trim() || "";

            } catch (err) {
              console.error(err);

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: "⚠️ AI 分析失败，请稍后重试或提供完整 crash log。"
              });

              return;
            }

            // =========================
            // 4. 防循环 + SKIP 控制
            // =========================
            if (!output.startsWith("REPORT")) {
              console.log("Skip non-bug:", output);
              return; // ❗不回复 issue
            }

            const responseText = output.replace(/^REPORT\s*/, "").trim();

            // =========================
            // 5. 回复 issue
            // =========================
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: responseText || "无法生成分析结果，请提供完整 crash log。"
            });
